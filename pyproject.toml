[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ganimedes"
version = "0.1.0"
description = "Sistema de monitoreo y proctorización para instancias JupyterLite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ganimedes Contributors"}
]
keywords = ["jupyterlite", "proctoring", "monitoring", "education", "supabase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/usuario/ganimedes"
Documentation = "https://github.com/usuario/ganimedes/blob/main/README.md"
Repository = "https://github.com/usuario/ganimedes"
"Bug Tracker" = "https://github.com/usuario/ganimedes/issues"

[project.scripts]
ganimedes = "ganimedes.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ganimedes*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
ganimedes = ["py.typed"]
