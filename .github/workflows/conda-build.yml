name: Build and Publish Conda Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-conda:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,defaults
          
      - name: Install conda-build
        shell: bash -l {0}
        run: |
          conda install conda-build anaconda-client -y
          
      - name: Build conda package
        shell: bash -l {0}
        run: |
          mkdir -p dist/conda
          conda build conda-recipe --output-folder ./dist/conda
          
      - name: Test package
        shell: bash -l {0}
        run: |
          # Crear ambiente de prueba
          conda create -n test python=3.11 -y
          conda activate test
          
          # Instalar paquete
          PACKAGE=$(find ./dist/conda -name "ganimedes-*.conda" -type f | head -n 1)
          conda install $PACKAGE -y
          
          # Probar imports
          python -c "import ganimedes"
          python -c "import ganimedes.server"
          python -c "import ganimedes.auth"
          python -c "import ganimedes.monitor"
          
      - name: Upload to Anaconda.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -n "$ANACONDA_TOKEN" ]; then
            PACKAGE=$(find ./dist/conda -name "ganimedes-*.conda" -type f | head -n 1)
            anaconda -t $ANACONDA_TOKEN upload --force $PACKAGE
          else
            echo "⚠️  ANACONDA_TOKEN no configurado. No se subirá el paquete."
          fi
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conda-package
          path: dist/conda/**/*.conda
          retention-days: 30
